name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_bin: ajisai-cli
            asset_cli: ajisai-cli-linux-x86_64
            build_gui: false

          - os: macos-latest
            target: x86_64-apple-darwin
            cli_bin: ajisai-cli
            asset_cli: ajisai-cli-macos-x86_64
            build_gui: true

          - os: macos-latest
            target: aarch64-apple-darwin
            cli_bin: ajisai-cli
            asset_cli: ajisai-cli-macos-arm64
            build_gui: true

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_bin: ajisai-cli.exe
            asset_cli: ajisai-cli-windows-x86_64.exe
            build_gui: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libssl-dev pkg-config \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev

      - name: Build CLI
        run: cargo build --release --bin ajisai-cli --target ${{ matrix.target }}

      - name: Build GUI
        if: matrix.build_gui == true
        run: cargo build --release --bin ajisai-gui --target ${{ matrix.target }}
        continue-on-error: true

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_cli }}
          path: target/${{ matrix.target }}/release/${{ matrix.cli_bin }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
