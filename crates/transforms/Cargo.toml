[package]
name    = "ajisai-transforms"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ajisai-core = { workspace = true }
thiserror   = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
async-trait = { workspace = true }
rayon       = { workspace = true }
tracing     = { workspace = true }
csv              = "1"
calamine         = "0.25"
rust_xlsxwriter  = "0.70"
reqwest          = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
parquet          = { version = "54", features = ["async"] }
arrow-array      = "54"
arrow-schema     = "54"
quick-xml        = "0.37"
regex            = "1"
rhai             = { version = "1", features = ["sync"] }
ajisai-hop-compat = { workspace = true }
sqlx        = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "mysql", "macros"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["db"]
db      = ["dep:sqlx"]
